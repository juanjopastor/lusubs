<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Preview subtitles and export them as a clean HTML document.">
  <meta name="theme-color" content="#17221f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LuSubs">
  <title>LuSubs | Subtitle HTML export</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="." aria-label="LuSubs, inicio">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span id="appTitle">LuSubs</span>
    </a>
    <nav class="header-actions" aria-label="Subtitle and audio actions">
      <button id="loadButton" class="icon-button" type="button" aria-label="Load subtitles" title="Load subtitles">
        <svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 7h6l2 2h10v11H3z" />
          <path d="M3 7V5h7l2 2" />
        </svg>
      </button>
      <input id="fileInput" type="file" accept=".srt,.vtt" multiple hidden>
      <button id="loadAudioButton" class="icon-button icon-button-audio" type="button" aria-label="Load MP3 audio" title="Load MP3 audio">
        <span class="nav-icon" aria-hidden="true">♫</span>
      </button>
      <input id="audioInput" type="file" accept=".mp3,audio/mpeg" hidden>
      <button id="downloadVttButton" class="icon-button icon-button-vtt" type="button" aria-label="Save annotated subtitle as WebVTT" title="Save annotated subtitle as WebVTT" disabled>
        <svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h12l4 4v14H3V3z" />
          <path d="M7 3v6h10V3M7 21v-8h10v8M16 5h.01" />
        </svg>
      </button>
      <button id="downloadHtmlButton" class="icon-button icon-button-primary" type="button" aria-label="Save HTML" title="Save HTML" disabled>
        <svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9V3h12v6M6 17H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2" />
          <path d="M6 14h12v7H6zM18 12h.01" />
        </svg>
      </button>
      <button id="installButton" class="icon-button" type="button" aria-label="Install LuSubs" title="Install LuSubs" hidden>
        <svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v12m-5-5 5 5 5-5M4 20h16" />
        </svg>
      </button>
    </nav>
  </header>

  <main id="workspace" class="workspace" aria-label="Subtitle preview">
    <div id="previewContainer" class="preview-content" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
